<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="p-6">
    <section>
        <h1 class="text-4xl bg-gray-300 p-3 mb-3">display: flex</h1>
        <div class="flex gap-4">
            <div class="bg-blue-500 text-white px-10 py-4 rounded">
                item 1
            </div>
            <div class="bg-green-500 text-white  px-10 py-4 rounded">
                item 2
            </div>
            <div class="bg-red-500 text-white  px-10 py-4 rounded ">
                item 3
            </div>

        </div>
    </section>


    <section>
        <h1>Grid </h1>
        <div class="grid grid-cols-4 gap-3">
            <div class="bg-blue-500 p-6 rounded text-center text-white ">1</div>
            <div  class="bg-green-500 p-6 rounded text-center text-white">2</div>
            <div  class="bg-red-500 p-6 rounded text-center text-white">3</div>
            <div  class="bg-purple-500 p-6 rounded text-center text-white">4</div>
        </div>
    </section>




    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Spacing Practical</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-10 space-y-14">

    <!-- ====================================== -->
    <!-- 1. Padding -->
    <!-- ====================================== -->

    <section>
        <h2 class="text-3xl font-bold mb-5">
            1. Padding (p-*)
        </h2>

        <div class="bg-blue-500 text-white p-2 mb-3">
            p-2
        </div>

        <div class="bg-blue-500 text-white p-4 mb-3">
            p-4
        </div>

        <div class="bg-blue-500 text-white p-8 mb-3">
            p-8
        </div>

        <div class="bg-blue-500 text-white p-12">
            p-12
        </div>

    </section>


    <!-- ====================================== -->
    <!-- 2. Margin -->
    <!-- ====================================== -->

    <section>

        <h2 class="text-3xl font-bold mb-5">
            2. Margin (m-*)
        </h2>

        <div class="bg-green-500 text-white p-3 m-2">
            m-2
        </div>

        <div class="bg-green-500 text-white p-3 m-4">
            m-4
        </div>

        <div class="bg-green-500 text-white p-3 m-8">
            m-8
        </div>

    </section>


    <!-- ====================================== -->
    <!-- 3. Horizontal Padding -->
    <!-- ====================================== -->

    <section>

        <h2 class="text-3xl font-bold mb-5">
            3. Horizontal Padding (px-*)
        </h2>

        <button class="bg-purple-500 text-white px-4 py-2 rounded">
            px-4
        </button>

        <button class="bg-purple-500 text-white px-8 py-2 rounded">
            px-8
        </button>

    </section>


    <!-- ====================================== -->
    <!-- 4. Vertical Padding -->
    <!-- ====================================== -->

    <section>

        <h2 class="text-3xl font-bold mb-5">
            4. Vertical Padding (py-*)
        </h2>

        <button class="bg-red-500 text-white px-6 py-2 rounded">
            py-2
        </button>

        <button class="bg-red-500 text-white px-6 py-6 rounded">
            py-6
        </button>

    </section>


    <!-- ====================================== -->
    <!-- 5. Individual Sides -->
    <!-- ====================================== -->

    <section>

        <h2 class="text-3xl font-bold mb-5">
            5. Individual Side Spacing
        </h2>

        <div class="bg-yellow-300 pt-8 pr-8 pb-8 pl-8">
            pt-8 pr-8 pb-8 pl-8
        </div>

    </section>


    <!-- ====================================== -->
    <!-- 6. Combined Example -->
    <!-- ====================================== -->

    <section>

        <h2 class="text-3xl font-bold mb-5">
            6. Card Example
        </h2>

        <div class="max-w-sm border rounded-lg p-6">

            <h3 class="text-xl font-bold mb-3">
                Tailwind CSS
            </h3>
            

            <p class="mb-5">
                Spacing utilities make layouts clean and readable.
            </p>

            <button class="bg-blue-600 text-white px-5 py-2 rounded">
                Learn More
            </button>

        </div>

    </section>

</body>
</html>

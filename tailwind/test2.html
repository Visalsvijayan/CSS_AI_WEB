 <!DOCTYPE html>
<html lang="en" class="dark"  >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 transition-all duration-300">

<div class="max-w-md mx-auto mt-16">

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">

        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
            Student Dashboard
        </h1>

        <p class="mt-3 text-gray-600 dark:text-gray-300">
            Welcome back! Your classes are ready.
        </p>

        <input
            type="text"
            placeholder="Search..."
            class="w-full mt-5 p-3 rounded border
                   border-gray-300
                   bg-white
                   text-black
                   dark:bg-gray-700
                   dark:border-gray-600
                   dark:text-white">

        <button
            class="mt-5 w-full bg-blue-600 hover:bg-blue-700
                   text-white py-3 rounded">
            Continue
        </button>

    </div>

</div>

</body>
</html>

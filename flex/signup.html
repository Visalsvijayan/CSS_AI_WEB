<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Signup Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    
    /* Flexbox for centering */
    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
}

.signup-form {
    background: white;
    padding: 2rem;
    border-radius: 15px;

    /* Flexbox */
    display: flex;
    flex-direction: column;
    gap: 1rem;

    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
}

.signup-form h2 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
}

/* Flex row */
.row {
    display: flex;
    gap: 1rem;
}

/* Flex item */
.input-group {
    flex: 1;

    display: flex;
    flex-direction: column;
    gap: 6px;
}

label {
    font-size: 14px;
    font-weight: 600;
    color: #555;
}

input[type="text"],
input[type="email"],
input[type="password"] {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 5px rgba(79, 70, 229, 0.3);
}

.checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 5px;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #4338ca;
}

 
    </style>
</head>
<body>

    <div class="container">
        <form class="signup-form">
            <h2>Create Account</h2>

            <div class="row">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" placeholder="John">
                </div>

                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Doe">
                </div>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="john@example.com">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="••••••••">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the Terms & Conditions</label>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: flex-start;
            border: 1px solid black;
            padding: 10 px;
            background-color: aqua;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: gray;
            margin: 5px;
        }
        .flex-start{
            justify-content: flex-start;
        }
        .flex-end{
            justify-content: flex-end;
        }
        .space-around{
            justify-content: space-around;
        }
    </style>
</head>
<body>
    <h1>Justify content Property</h1>

    <h3>flex-start</h3>
    <div class="container flex-start">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <h3>flex-end</h3>
    <div class="container flex-end">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <h3>space-around</h3>
    <div class="container space-around">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>

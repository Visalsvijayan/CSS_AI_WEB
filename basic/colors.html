<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 150px;
            height: 50px;
          
            border-radius: 10px;
            text-align: center;
            color: white;
            margin-bottom: 5px;
        }
        .div1{
            background-color: red;
        }
        .div2{
            background-color: #000000;
        }
        .div3{
            background-color:rgb(0,255,0);
        }
        .div4{
            background-color:rgba(0,255,0,0.5);
        }
        .div5{
            background-color:hsl(120, 87%, 12%);
        }

        #outer{
            width: 400px;
            height: 400px;
            background-color: red;
            padding: 5px;
        }
        #inner{
            width: 50%;
               height: 400px;
            background-color: rgb(0, 255, 157);
        }
    </style>
</head>
<body>
    <div class="box div1">
          color:'red'
    </div>

    <div class="box div2">
          color:'#000000'
    </div>
    <div class="box div3">
          color:'rgb(0,255,0)'
    </div>
    <div class="box div4">
          color:'rgba(0,255,0,0.5)'
    </div>
    <div class="box div5">
          color:'rgba(0,255,0,0.5)'
    </div>




    <div id="outer">
        <div id="inner"></div>
    </div>
    
</body>
</html>

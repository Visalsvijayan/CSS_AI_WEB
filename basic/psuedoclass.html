<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       a:link{
         color: orange;
       }
       a:visited{
          color: red;
       }
       a:active{
         color: green;
       }
       
       #btn:hover{
          padding: 10px;
          background-color: green;

       }
       
       input:focus{
          background-color: blueviolet;
          border: 5px solid green;
       }

    </style>

</head>
<body>
    <h1>CSS Pseudo class selector</h1>
    <p>visited link will appear in red color , unvisitd link is orange color, activated link is in green color</p>
    <a  href="https://youtu.be/CkUbMMDZQ7A?si=mfm0VDD8He9AuBFy">video link</a>  <br>
    
    <p>Hover applied on button</p>
    <button id="btn">Login</button>
     
    <p>focus Pseudo class applied on input box</p>
    <input  type="text">
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        div~p{
           background-color: red; 
        }
    </style>
  </head>
  <body>
    <h1>Next sibling combinator</h1>
    <p>
      This combinator will select all elements that is after a specific
      element
    </p>
    <div>
      <p>paragraph 1</p>
      <p>paragraph 2</p>
    </div>
    <p>paragraph 3</p>
    <p>paragraph 4</p>
    <div>
      <p>paragraph 5</p>
      <p>paragraph 6</p>
    </div>
    <p>paragraph 7</p>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1{
            border-width:5px;
            border-color: green;
            border-style: solid;
            border-radius: 10px;
            
        }
        .para1{
            text-align: center;
        }
        #div2{
            border:5px dashed red ;
        }
    </style>
</head>
<body>
    <h1>Border properties</h1>

    <div id="div1">
        <p class="para1">Hello world</p>
    </div>
    <br>
    <div id="div2"> <p class="para1">second div</p></div>
</body>
</html>
